<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوش مصنوعی پرهام گذرچی نژاد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes bounce-dot {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40% { transform: translateY(-6px); opacity: 1; }
        }
        .dot-1 { animation: bounce-dot 1.4s infinite ease-in-out both; animation-delay: -0.32s; }
        .dot-2 { animation: bounce-dot 1.4s infinite ease-in-out both; animation-delay: -0.16s; }
        .dot-3 { animation: bounce-dot 1.4s infinite ease-in-out both; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-2xl bg-indigo-500 text-white flex items-center justify-center text-xl shadow-md">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h1 class="font-bold text-base">هوش مصنوعی پرهام گذرچی نژاد</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">دستیار هوشمند شخصی</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button type="button" id="theme-toggle-btn" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
            </button>
            <button type="button" id="new-chat-btn" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold">
                <i class="fa-solid fa-plus"></i> گفتگوی جدید
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
            <div id="messages-list" class="space-y-4"></div>
        </div>

        <div class="p-3 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 max-w-4xl w-full mx-auto shrink-0">
            <form id="chat-form">
                <div class="flex items-end bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-2xl p-2">
                    <textarea id="user-input" rows="1" placeholder="سوالت رو بنویس..." 
                        class="flex-1 bg-transparent border-none outline-none resize-none px-3 py-2 text-sm max-h-32 hide-scrollbar"></textarea>
                    <button type="submit" class="p-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shrink-0 w-10 h-10 flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const WORKER_API_URL = "https://delicate-wood-5c58.parhamgozarchi40.workers.dev/";

        const SYSTEM_PROMPT = `تو یک دستیار هوش مصنوعی شخصی هستی که توسط «پرهام گذرچی نژاد» ساخته شده است. اگر پرسیدند چه کسی تو را ساخته، بگو: «من توسط پرهام گذرچی نژاد ساخته شده‌ام.» همیشه فارسی، دوستانه و مودبانه جواب بده.`;

        const WELCOME_MESSAGE = `سلام 👋

من هوش مصنوعی پرهام گذرچی نژاد هستم.

از پرهام گذرچی نژاد ساخته شده‌ام. هر سوالی داری بپرس! 😊`;

        let appState = { darkMode: false, chats: [], activeChatId: null };

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('free_ai_state');
            if (saved) { try { appState = JSON.parse(saved); } catch(e) {} }
            applyTheme();
            if (!appState.activeChatId) createNewChat();
            initEventListeners();
        });

        function saveToLocalStorage() { localStorage.setItem('free_ai_state', JSON.stringify(appState)); }

        function applyTheme() {
            const htmlElem = document.documentElement;
            if (appState.darkMode) { htmlElem.classList.add('dark'); htmlElem.classList.remove('light'); }
            else { htmlElem.classList.remove('dark'); htmlElem.classList.add('light'); }
        }

        function initEventListeners() {
            document.getElementById('theme-toggle-btn').addEventListener('click', () => {
                appState.darkMode = !appState.darkMode;
                applyTheme();
                saveToLocalStorage();
            });
            document.getElementById('new-chat-btn').addEventListener('click', () => createNewChat());
            document.getElementById('chat-form').addEventListener('submit', handleSendMessage);

            const userInput = document.getElementById('user-input');
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
            userInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    document.getElementById('chat-form').requestSubmit();
                }
            });
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'گفتگوی جدید',
                messages: [{ role: 'assistant', content: WELCOME_MESSAGE }]
            };
            appState.chats.unshift(newChat);
            appState.activeChatId = newChat.id;
            saveToLocalStorage();
            loadMessages();
        }

        function getActiveChat() {
            if (!appState.chats.length) createNewChat();
            let active = appState.chats.find(c => c.id === appState.activeChatId);
            if (!active) { active = appState.chats[0]; appState.activeChatId = active.id; }
            return active;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function loadMessages() {
            const chat = getActiveChat();
            const list = document.getElementById('messages-list');
            list.innerHTML = '';
            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                if (msg.role === 'user') {
                    div.className = 'flex justify-end mb-4';
                    div.innerHTML = `
                        <div class="max-w-[85%] bg-indigo-600 text-white rounded-3xl rounded-tl-sm px-5 py-3 text-sm shadow-sm whitespace-pre-wrap">${escapeHtml(msg.content)}</div>
                    `;
                } else {
                    div.className = 'flex justify-start mb-4 gap-3';
                    div.innerHTML = `
                        <div class="w-8 h-8 rounded-xl bg-indigo-500 text-white flex items-center justify-center text-sm shadow-md shrink-0 mt-1">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="max-w-[85%] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 rounded-3xl rounded-tr-sm px-5 py-4 text-sm shadow-sm whitespace-pre-wrap">${escapeHtml(msg.content)}</div>
                    `;
                }
                list.appendChild(div);
            });
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';

            const chat = getActiveChat();
            chat.messages.push({ role: 'user', content: text });

            if (chat.messages.length === 2) {
                chat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
            }

            saveToLocalStorage();
            loadMessages();

            // نمایش "در حال پردازش"
            const list = document.getElementById('messages-list');
            const thinking = document.createElement('div');
            thinking.id = 'thinking-indicator';
            thinking.className = 'flex justify-start mb-4 gap-3';
            thinking.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-indigo-500 text-white flex items-center justify-center text-sm shadow-md shrink-0 mt-1">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl rounded-tr-sm px-4 py-3 text-sm shadow-sm flex items-center gap-2">
                    <span class="text-slate-500 dark:text-slate-400">در حال پردازش</span>
                    <div class="flex gap-1">
                        <span class="w-2 h-2 rounded-full bg-indigo-500 dot-1"></span>
                        <span class="w-2 h-2 rounded-full bg-indigo-500 dot-2"></span>
                        <span class="w-2 h-2 rounded-full bg-indigo-500 dot-3"></span>
                    </div>
                </div>
            `;
            list.appendChild(thinking);
            scrollToBottom();

            try {
                const apiMessages = [
                    { role: "system", content: SYSTEM_PROMPT },
                    ...chat.messages
                        .filter((m, i) => !(i === 0 && m.role === 'assistant'))
                        .map(m => ({ role: m.role, content: m.content }))
                ];

                const response = await fetch(WORKER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: apiMessages })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                let reply = 'پاسخی دریافت نشد.';
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    reply = data.choices[0].message.content;
                } else if (data.response) {
                    reply = data.response;
                } else if (data.error) {
                    reply = `❌ ${data.error}`;
                }

                chat.messages.push({ role: 'assistant', content: reply });
                saveToLocalStorage();
            } catch (err) {
                chat.messages.push({ role: 'assistant', content: `❌ خطا: ${err.message}` });
                saveToLocalStorage();
            } finally {
                const t = document.getElementById('thinking-indicator');
                if (t) t.remove();
                loadMessages();
            }
        }
    </script>
</body>
</html>
