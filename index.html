<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هوش مصنوعی من</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Vazirmatn', sans-serif; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }
  .dot { animation: bounce 1.4s infinite ease-in-out both; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  .dot:nth-child(3) { animation-delay: -0.32s; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

  <header class="bg-slate-800 border-b border-slate-700 p-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xl">🤖</div>
      <h1 class="font-bold text-lg text-white">هوش مصنوعی من</h1>
    </div>
    <button onclick="clearChat()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs">🗑️ پاک کردن</button>
  </header>

  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
    <div class="text-center text-slate-500 mt-10">
      <div class="text-5xl mb-3">👋</div>
      <p class="text-lg font-semibold text-slate-300">سلام! چطور می‌تونم کمکت کنم؟</p>
    </div>
  </main>

  <div class="bg-slate-800 border-t border-slate-700 p-3">
    <form id="chat-form" class="max-w-3xl mx-auto flex items-end gap-2 bg-slate-900 border border-slate-700 rounded-2xl p-2 focus-within:border-indigo-500">
      <textarea id="user-input" rows="1" placeholder="پیامت رو بنویس..."
        class="flex-1 bg-transparent outline-none resize-none px-3 py-2 text-slate-100 placeholder-slate-500 max-h-32"></textarea>
      <button type="submit" id="send-btn"
        class="w-10 h-10 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </button>
    </form>
  </div>

<script>
// ==========================================
// این خط رو با کلید خودت عوض کن
// ==========================================
const OPENROUTER_API_KEY = "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";
const MODEL = "openrouter/free";

// ==========================================
// تاریخچه چت
// ==========================================
let messages = [
  { role: "system", content: "تو یک دستیار هوش مصنوعی فارسی‌زبان و خوش‌برخورد هستی. همیشه فارسی جواب بده." }
];

const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');
const chatBox = document.getElementById('chat-box');
const sendBtn = document.getElementById('send-btn');

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage(text, 'user');
  messages.push({ role: 'user', content: text });

  const thinkingEl = addThinking();
  sendBtn.disabled = true;

  try {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${OPENROUTER_API_KEY}`
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        temperature: 0.7,
        max_tokens: 2048
      })
    });

    const data = await res.json();
    thinkingEl.remove();

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      messages.push({ role: 'assistant', content: reply });
      addMessage(reply, 'assistant');
    } else {
      addMessage("خطا: " + (data.error?.message || 'پاسخ نامشخص'), 'assistant');
    }
  } catch (err) {
    thinkingEl.remove();
    addMessage("خطا در ارتباط: " + err.message, 'assistant');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

function addMessage(text, role) {
  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} gap-2`;

  if (isUser) {
    div.innerHTML = `
      <div class="max-w-[80%] bg-indigo-600 text-white rounded-2xl rounded-tl-sm px-4 py-3 text-sm whitespace-pre-wrap"></div>
      <div class="w-8 h-8 rounded-lg bg-slate-700 flex items-center justify-center shrink-0">👤</div>
    `;
  } else {
    div.innerHTML = `
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shrink-0">🤖</div>
      <div class="max-w-[80%] bg-slate-800 border border-slate-700 rounded-2xl rounded-tr-sm px-4 py-3 text-sm whitespace-pre-wrap"></div>
    `;
  }

  const contentDiv = isUser ? div.querySelector('div:first-child') : div.querySelector('div:last-child');
  contentDiv.textContent = text;

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'flex justify-start gap-2';
  div.innerHTML = `
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shrink-0">🤖</div>
    <div class="bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 flex gap-1 items-center">
      <span class="w-2 h-2 bg-indigo-400 rounded-full dot"></span>
      <span class="w-2 h-2 bg-indigo-400 rounded-full dot"></span>
      <span class="w-2 h-2 bg-indigo-400 rounded-full dot"></span>
    </div>
  `;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function clearChat() {
  if (!confirm('همه پیام‌ها پاک بشن؟')) return;
  messages = [messages[0]];
  chatBox.innerHTML = `
    <div class="text-center text-slate-500 mt-10">
      <div class="text-5xl mb-3">👋</div>
      <p class="text-lg font-semibold text-slate-300">چت پاک شد!</p>
    </div>
  `;
}
</script>
</body>
</html>
